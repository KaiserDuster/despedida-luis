<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Despedida de soltero de Luis</title>
<style>
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:#0b0b0f; color:#f5f5f5; font-family:Arial,Helvetica,sans-serif;
    text-align:center; padding:24px;
  }
  .card{
    width:min(680px,100%); padding:42px 28px; border:1px solid #292932;
    border-radius:24px; background:linear-gradient(145deg,#15151b,#0f0f14);
    box-shadow:0 20px 70px rgba(0,0,0,.45);
  }
  .tag{font-size:13px; letter-spacing:3px; color:#aaa; text-transform:uppercase}
  h1{font-size:clamp(30px,7vw,58px); margin:14px 0 8px}
  .subtitle{font-size:18px;color:#c7c7cc;margin:0 0 30px}
  .timer{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .unit{background:#09090d;border-radius:16px;padding:18px 8px;border:1px solid #24242c}
  .num{font-size:clamp(30px,7vw,52px);font-weight:700;font-variant-numeric:tabular-nums}
  .label{font-size:11px;color:#888;text-transform:uppercase;letter-spacing:1.5px;margin-top:5px}
  .deadline{margin-top:28px;color:#aaa;font-size:14px}
  .final{display:none;font-size:30px;font-weight:700;margin-top:25px}
  @media(max-width:430px){.card{padding:32px 16px}.timer{gap:6px}.unit{padding:14px 4px}}
</style>
</head>
<body>
<div class="card">
  <div class="tag">Operación: Despedida de soltero</div>
  <h1>La despedida de Luis</h1>
  <p class="subtitle">Se acabó el tiempo de darle vueltas.</p>

  <div class="timer" id="timer">
    <div class="unit"><div class="num" id="days">00</div><div class="label">Días</div></div>
    <div class="unit"><div class="num" id="hours">00</div><div class="label">Horas</div></div>
    <div class="unit"><div class="num" id="mins">00</div><div class="label">Minutos</div></div>
    <div class="unit"><div class="num" id="secs">00</div><div class="label">Segundos</div></div>
  </div>

  <div class="deadline">Decisión límite: miércoles 30 de septiembre de 2026, 11:59 PM</div>
  <div class="final" id="final">⏰ SE ACABÓ EL TIEMPO. HAY QUE DECIDIR.</div>
</div>

<script>
const deadline = new Date("2026-09-30T23:59:59-06:00").getTime();

function tick(){
  const diff = deadline - Date.now();
  if(diff <= 0){
    document.getElementById("timer").style.display="none";
    document.getElementById("final").style.display="block";
    return;
  }
  const s=Math.floor(diff/1000);
  const d=Math.floor(s/86400);
  const h=Math.floor((s%86400)/3600);
  const m=Math.floor((s%3600)/60);
  const sec=s%60;
  document.getElementById("days").textContent=String(d).padStart(2,"0");
  document.getElementById("hours").textContent=String(h).padStart(2,"0");
  document.getElementById("mins").textContent=String(m).padStart(2,"0");
  document.getElementById("secs").textContent=String(sec).padStart(2,"0");
}
tick(); setInterval(tick,1000);
</script>
</body>
</html>
